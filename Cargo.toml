[package]
name = "musixmatch"
version = "0.1.4"
edition = "2021"
readme = "README.md"
authors = ["Aarav Shah <aaravaditya51@gmail.com>"]
description = "A lightweight and intuitive library for accessing musixmatch api in rust"
documentation = "https://docs.rs/musixmatch"
repository = "https://github.com/Deaths-Door/musixmatch-rs"
homepage = "https://github.com/Deaths-Door/musixmatch-rs"
license = "MIT OR Apache-2.0"
keywords = ["musixmatch","api","lyrics","search","music"]

[dependencies]
# For API
api-request-utils-rs =  "0.2.5"
bon = "2.0.1"
chrono = { version = "0.4.38" , default-features = false }
strum = {version ="0.26.3",features = ["derive"]}

[dev-dependencies]
dotenvy = "0.15.0"

# https://docs.rs/tokio/latest/tokio/attr.test.html
tokio ={ version = "1.40.0" , features = ["rt","macros"]}

[lints.rust]
unsafe_code = "forbid"
unused_imports= "forbid"
unused_variables= "forbid"
unused_allocation= "forbid"
unused_must_use= "forbid"
unreachable_patterns= "forbid"
trivial_casts= "forbid"
unsafe_op_in_unsafe_fn= "forbid"
overflowing_literals= "forbid"
missing_docs = "deny"